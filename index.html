)}.footright a:hover{color:var(--accent)}@media(max-width:780px){.wrap{width:calc(100% - 44px)}.header{height:76px}.logo{width:154px}.nav{gap:16px;font-size:13px}.hero{grid-template-columns:1fr;gap:20px;padding:55px 0 35px;min-height:auto}h1{font-size:clamp(54px,12vw,90px)}.art{max-width:420px;justify-self:center}.footer{align-items:flex-start;gap:24px;flex-wrap:wrap}.footright{text-align:left}.footbrand span{padding-left:0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style></head><body><div class="wrap"><header class="header"><img class="logo" src="logo.png" alt="Chrysasynth"><nav class="nav" aria-label="Main navigation"><a class="social" href="https://www.youtube.com/@Chrysasynth" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="m10 9 5 3-5 3Z"/></svg>YouTube</a></nav></header><main class="hero"><div class="copy"><p class="kicker">Independent creative audio tools</p><h1>Make sound<span>make sense.</span></h1><p class="intro">Explore sound, discover new ideas and find your next creative starting point with Forge, our browser-based audio laboratory.</p><a class="cta" href="https://forge.chrysasynth.com/">Explore Forge</a></div><div class="art" aria-hidden="true"><svg viewBox="0 0 500 500"><defs><radialGradient id="halo"><stop stop-color="#6aa34d" stop-opacity=".13"/><stop offset="1" stop-color="#141618" stop-opacity="0"/></radialGradient><linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9ffb6"/><stop offset="1" stop-color="#507e60"/></linearGradient><radialGradient id="light" gradientUnits="userSpaceOnUse" cx="250" cy="250" r="145"><stop stop-color="#efffda" stop-opacity=".30"/><stop offset="1" stop-color="#a9f27c" stop-opacity="0"/></radialGradient></defs><circle cx="250" cy="250" r="240" fill="url(#halo)"/><g id="waves" fill="none" stroke="url(#stroke)" stroke-width=".85"></g><circle id="sheen" cx="250" cy="250" r="240" fill="url(#light)" opacity="0" pointer-events="none"/></svg><span class="caption">SOUND / EXPLORATION</span></div></main><footer class="footer"><span>© 2025–2026 Chrysasynth. All rights reserved.</span></footer></div><script>
(() => {
const g=document.getElementById('waves'), art=document.querySelector('.art'), light=document.getElementById('light'), sheen=document.getElementById('sheen');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const paths=Array.from({length:46},(_,j)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('opacity',(.24+j*.014).toFixed(2));g.appendChild(p);return p});
const samples=Array.from({length:145},(_,i)=>{let t=i/144*Math.PI*2;return {t,c:Math.cos(t),s:Math.sin(t)}});
let current={x:250,y:250,m:0},target={...current},frame=0,last=0;
function draw(){
 const m=current.m, vx=current.x-250,vy=current.y-250, dist=Math.hypot(vx,vy), ux=dist?vx/dist:0,uy=dist?vy/dist:0;
 const a=-.42+Math.tanh(vx/550)*.13*m,ca=Math.cos(a),sa=Math.sin(a);
 paths.forEach((p,j)=>{let d='';samples.forEach(({t,c,s},i)=>{
 let r=70+j*2.6+18*Math.sin(3*t+j*.105)+10*Math.cos(5*t-j*.07);
 let x=r*c,y=r*s*.69,X=x*ca-y*sa,Y=x*sa+y*ca;
 // Broad, continuous attraction: the facing side stretches more than the far side.
 let facing=(X*ux+Y*uy)/(Math.hypot(X,Y)||1);
 let pull=Math.pow(Math.max(0,(facing+1)/2),2.6);
 // A bounded magnetic field: the sculpture stretches, but never chases the cursor.
 let reach=185*Math.tanh(Math.max(0,dist-65)/300)*m*(.035+.965*pull);
 let layer=.82+.18*j/(paths.length-1);
 X+=ux*reach*layer;Y+=uy*reach*layer;
 let ripple=m*6*Math.sin(t*4+j*.12);X+=c*ripple;Y+=s*ripple;
 d+=(i?'L':'M')+(250+X).toFixed(1)+' '+(250+Y).toFixed(1);
 });p.setAttribute('d',d+'Z');p.setAttribute('opacity',(.24+j*.014).toFixed(2));});
}
function tick(now){frame=0;const dt=last?Math.min(50,now-last):16;last=now;const ease=1-Math.exp(-dt/250);for(const k of ['x','y','m'])current[k]+=(target[k]-current[k])*ease;draw();if(Math.abs(current.x-target.x)+Math.abs(current.y-target.y)+Math.abs(current.m-target.m)*100>.15)frame=requestAnimationFrame(tick);else{current={...target};draw();last=0}}
function schedule(){if(reduced.matches){current={...target};draw();return}if(!frame)frame=requestAnimationFrame(tick)}
function reset(){target={x:250,y:250,m:0};schedule()}
window.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const svg=art.querySelector('svg'), matrix=svg.getScreenCTM();if(!matrix)return;const point=new DOMPoint(e.clientX,e.clientY).matrixTransform(matrix.inverse());target={x:point.x,y:point.y,m:1};schedule()},{passive:true});
document.documentElement.addEventListener('pointerleave',reset);window.addEventListener('blur',reset);window.addEventListener('resize',reset);reduced.addEventListener('change',()=>{if(frame)cancelAnimationFrame(frame);frame=0;last=0;current={x:250,y:250,m:0};target={...current};draw()});

draw();
})();
</script></body></html>
